version: "3.9"

services:
  # Entorno BLUE - Producción actual (v1.0.0)
  orders-blue:
    build:
      context: .
      args:
        APP_VERSION: "1.0.0"
        ENVIRONMENT: "blue"
    container_name: orders-blue
    environment:
      - APP_VERSION=1.0.0
      - ENVIRONMENT=blue
    ports:
      - "8001:8000"
    networks:
      - orders-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    labels:
      - "traefik.enable=false"
      - "deployment.strategy=blue-green"
      - "deployment.slot=blue"

  # Entorno GREEN - Nueva versión (v2.0.0)
  orders-green:
    build:
      context: .
      args:
        APP_VERSION: "2.0.0"
        ENVIRONMENT: "green"
    container_name: orders-green
    environment:
      - APP_VERSION=2.0.0
      - ENVIRONMENT=green
    ports:
      - "8002:8000"
    networks:
      - orders-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    labels:
      - "deployment.strategy=blue-green"
      - "deployment.slot=green"

  # Load Balancer / Router de tráfico (simula AWS ALB)
  nginx-lb:
    image: nginx:alpine
    container_name: orders-lb
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      orders-blue:
        condition: service_healthy
      orders-green:
        condition: service_healthy
    networks:
      - orders-network
    restart: unless-stopped
    labels:
      - "deployment.role=load-balancer"

networks:
  orders-network:
    driver: bridge
    name: techmarket-orders-network
