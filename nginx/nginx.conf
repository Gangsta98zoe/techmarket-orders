events {
    worker_connections 1024;
}

http {
    upstream blue_backend {
        server orders-blue:8000;
    }

    upstream green_backend {
        server orders-green:8000;
    }

    # Variable de entorno para controlar cuál entorno está activo
    # blue = producción actual, green = nuevo despliegue
    map $http_x_target_env $target_backend {
        "green"  green_backend;
        default  blue_backend;
    }

    server {
        listen 80;
        server_name localhost;

        # Ruta principal - tráfico de producción (siempre al entorno activo)
        location / {
            # En producción esto apuntaría al entorno activo
            # Para la demo: blue es producción actual
            proxy_pass http://blue_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Environment "blue";
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }

        # Ruta de health para el load balancer
        location /nginx-health {
            return 200 '{"status":"ok","active_env":"blue"}';
            add_header Content-Type application/json;
        }

        # Ruta para acceder directamente al entorno green (pruebas previas al switch)
        location /green/ {
            proxy_pass http://green_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Environment "green";
        }
    }
}
